name: Update QQ protocol data

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-qq-protocol
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "6.0.x"

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip"
          if (Test-Path (Join-Path $sevenZip "7z.exe")) {
            $sevenZip | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Discover, verify and extract
        shell: pwsh
        run: ./scripts/update-protocol.ps1

      - name: Discover and extract QQNT desktop packages
        shell: pwsh
        run: python scripts/update-qqnt-desktop.py

      - name: Commit new protocol data
        shell: pwsh
        run: |
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No new QQ version was discovered."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $version = (Get-ChildItem desktop -Recurse -Filter *.json -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne "index.json" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1).BaseName
          if (-not $version) {
            $version = (Get-ChildItem sources -Filter *.json |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1).BaseName
          }
          git commit -m "Update QQ protocol data for $version"
          git push
