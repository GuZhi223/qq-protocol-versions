name: Update QQ protocol data

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Update scope
        type: choice
        options:
          - all
          - android-gray
        default: all

permissions:
  contents: write

concurrency:
  group: update-qq-protocol
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "6.0.x"

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip"
          if (Test-Path (Join-Path $sevenZip "7z.exe")) {
            $sevenZip | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Validate updater regression tests
        id: validate
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Updater regression tests failed." }
          ./tests/test_android_validation.ps1

      - name: Discover, verify and extract
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'android-gray' }}
        shell: pwsh
        run: ./scripts/update-protocol.ps1

      - name: Discover, verify and extract public Android gray builds
        if: ${{ !cancelled() && steps.validate.conclusion == 'success' }}
        shell: pwsh
        run: python scripts/update-android-gray.py

      - name: Discover and extract QQNT desktop packages
        if: ${{ !cancelled() && steps.validate.conclusion == 'success' && (github.event_name != 'workflow_dispatch' || inputs.target != 'android-gray') }}
        shell: pwsh
        run: python scripts/update-qqnt-desktop.py --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit new protocol data
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add android_phone android_pad sources desktop android_gray
          if ($LASTEXITCODE -ne 0) { throw "Unable to stage protocol data." }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No new QQ version was discovered."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "Unable to compare protocol data." }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $changedRecords = @(git diff --cached --name-only --diff-filter=AM)
          if ($LASTEXITCODE -ne 0) { throw "Unable to list updated protocol records." }
          $versions = @($changedRecords |
            Where-Object { $_ -match '^(android_phone|android_pad|sources)/[^/]+\.json$|^desktop/(windows|linux|macos)/[^/]+\.json$|^android_gray/(android_phone|android_pad|sources)/[^/]+\.json$' } |
            ForEach-Object { [System.IO.Path]::GetFileNameWithoutExtension($_) } |
            Sort-Object -Unique)
          $message = "Update QQ protocol data"
          if ($versions.Count -gt 0) {
            $message += " for " + ($versions -join ", ")
          }
          git commit -m $message
          if ($LASTEXITCODE -ne 0) { throw "Unable to commit protocol data." }
          git push
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish protocol data." }
